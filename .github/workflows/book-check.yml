name: Jupyter Book build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: manuscript-website/requirements.txt
      - run: python -m pip install -r manuscript-website/requirements.txt
      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.ipynb'):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY
      - name: Build book without executing notebooks
        run: jupyter-book build . --config manuscript-website/_config.yml --toc manuscript-website/_toc.yml
